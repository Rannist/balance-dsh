# balance-dsh bundle patch
#
# This is the `dsh.bundle.patch` layer of the published npm package. When the
# plugin is installed through the official CLI:
#
#   dsh plugin --profile <name> add balance-dsh@<version>
#
# the command reconciles the profile bundle stack against installed packages
# and, seeing this declaration, appends `balance-dsh` to the bundle stack.
# The profile boot then merges this patch (a single `insert` of the plugin row)
# exactly like a manual cordis.patch.yml mount line.
#
# NOTE: if a profile already carries the old manual mount line in its own
# cordis.patch.yml (e.g. `- id: balance / name: balance-dsh`), remove it before
# switching to the bundle channel to avoid double-mounting.
#
# To override DeepSeek API key / prices, add a `config` block to the inserted
# row. All fields are optional; the plugin falls back to the DEEPSEEK_API_KEY
# environment variable / credential store when `config.apiKey` is omitted.
- insert:
    - id: balance
      name: balance-dsh
      # config:
      #   apiKey: sk-xxxx              # optional; else DEEPSEEK_API_KEY env/credential
      #   peakWindows:                  # optional; default Mon-Fri 09-12 / 14-18 Beijing
      #     - {start: 9, end: 12}
      #     - {start: 14, end: 18}
      #   peakWeekdays: [1, 2, 3, 4, 5] # optional; 1=Mon ... 5=Fri
      #   price:                        # optional per-model overrides (CNY / 1M tokens)
      #     inputCnyPerMillion: 1.5
      #     cacheReadCnyPerMillion: 0.05
      #     cacheWriteCnyPerMillion: 0
      #     outputCnyPerMillion: 4.5
